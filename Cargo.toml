[package]
name = "kosmos-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-skia", "compat-1-2"] }
# Keep HTTP/2 disabled for the fallback client as well.
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "charset", "system-proxy"] }
rfd = "0.17.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
slint = { version = "1", default-features = false, features = ["renderer-software"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
