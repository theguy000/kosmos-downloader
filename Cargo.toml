[package]
name = "kosmos-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
# Using software renderer: no GPU/wgpu/D3D12 stack for lower memory usage.
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
# Keep HTTP/2 disabled for the fallback client as well.
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "charset", "system-proxy"] }
rfd = "0.17.2"
thiserror = "2.0.20"
# Only local-time formatting for history labels; no default features we do not use.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# History records are stored one JSON object per line.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
